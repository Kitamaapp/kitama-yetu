<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKULiKA | Exams & Notes Repository</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --primary: #0f4c81; --primary-light: #3a6ea5; --accent: #1eb53a;
    --bg-color: #f8f9fa; --surface: #ffffff; --text-dark: #1a1a1a;
    --text-light: #555555; --text-mute: #888888; --border: #e1e5e8;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.04); --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-dark); line-height: 1.6; }
  h1, h2, h3, h4 { font-family: 'Merriweather', serif; color: var(--text-dark); }
  a { text-decoration: none; color: var(--primary); }

  header { background: var(--surface); box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); }
  .nav-container { max-width: 1280px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
  .logo { display: flex; align-items: center; gap: 0.75rem; font-size: 1.4rem; font-weight: 700; color: var(--primary); cursor: pointer; }
  .logo i { color: var(--accent); }
  .nav-links { display: flex; gap: 1.5rem; list-style: none; }
  .nav-links a { color: var(--text-dark); font-weight: 500; font-size: 0.95rem; cursor: pointer; }
  .nav-links a:hover { color: var(--accent); }
  .btn-admin { background: var(--primary); color: #fff; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; }
  
  .container { max-width: 1280px; margin: 2rem auto; padding: 0 2rem; min-height: 70vh; }
  .hero { background: linear-gradient(135deg, var(--primary) 0%, #0a2e50 100%); color: #fff; padding: 4rem 2rem; text-align: center; }
  .hero h1 { color: #fff; font-size: 2.5rem; margin-bottom: 0.5rem; }
  
  .group-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm); }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: var(--bg-color); font-weight: 600; color: var(--text-light); font-size: 0.85rem; text-transform: uppercase; }
  tr:hover { background: var(--bg-color); }
  .btn-sm { padding: 0.4rem 0.8rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 0.3rem; text-decoration: none; }
  .btn-view { background: #e6f0f5; color: var(--primary); }
  .btn-download { background: var(--accent); color: #fff; }
  
  .wa-bubble { position: fixed; bottom: 20px; right: 20px; background: #25D366; color: #fff; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-size: 1.8rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 999; cursor: pointer; }
  
  .admin-grid { display: grid; grid-template-columns: 250px 1fr; gap: 2rem; }
  .admin-sidebar { background: var(--surface); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); height: fit-content; }
  .admin-sidebar button { display: block; width: 100%; text-align: left; padding: 0.75rem; background: none; border: none; cursor: pointer; font-weight: 500; color: var(--text-dark); border-radius: 4px; }
  .admin-sidebar button:hover, .admin-sidebar button.active { background: var(--bg-color); color: var(--primary); }
  .stat-box { background: var(--surface); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); text-align: center; }
  .stat-box h2 { font-size: 2rem; color: var(--primary); }
  .stat-box p { color: var(--text-light); font-size: 0.9rem; }
  
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.3rem; }
  .form-input { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-family: 'Inter', sans-serif; }
  .file-drop { padding: 2rem; border: 2px dashed var(--border); border-radius: 8px; text-align: center; cursor: pointer; color: var(--text-light); background: var(--bg-color); }
  
  .comment-box { background: var(--bg-color); padding: 1rem; border-radius: 6px; margin-bottom: 0.5rem; border-left: 3px solid var(--accent); }
  .comment-author { font-weight: 700; font-size: 0.85rem; color: var(--primary); }
  
  @media (max-width: 768px) {
    .nav-links { display: none; }
    .admin-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="nav-container">
    <div class="logo" onclick="navigate('home')"><i class="fas fa-graduation-cap"></i> SKU<i>KA</i></div>
    <ul class="nav-links">
      <li><a onclick="navigate('home')">Home</a></li>
      <li><a onclick="navigate('about')">About Us</a></li>
      <li><a onclick="navigate('contact')">Contact</a></li>
      <li><a onclick="navigate('privacy')">Privacy Policy</a></li>
      <li><a onclick="navigate('terms')">Terms of Service</a></li>
    </ul>
    <button class="btn-admin" onclick="navigate('admin')">Admin</button>
  </div>
</header>

<div id="appContent" class="container"><!-- Content --></div>

<a id="waBubble" class="wa-bubble" href="#" target="_blank" style="display: none;"><i class="fab fa-whatsapp"></i></a>

<!-- Read Modal -->
<div id="readModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; align-items:center; justify-content:center; padding:1rem;">
  <div style="background:#fff; width:100%; max-width:900px; height:90vh; border-radius:10px; overflow:hidden; display:flex; flex-direction:column;">
    <div style="background:var(--primary); color:#fff; padding:1rem 1.5rem; display:flex; justify-content:space-between; align-items:center;">
      <h3 id="modalTitle" style="color:#fff; font-family:'Inter';">Document Preview</h3>
      <button onclick="closeModal()" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;">&times;</button>
    </div>
    <iframe id="modalIframe" style="width:100%; flex:1; border:none;"></iframe>
  </div>
</div>

<footer style="background: var(--surface); border-top: 1px solid var(--border); padding: 2rem; text-align: center; margin-top: 3rem;">
  <p id="footerText" style="color: var(--text-light); font-size: 0.9rem;">© 2024 SKULiKA.</p>
</footer>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw1YOkYEZ2Lu1U_F0f5gzzJV2GEAMVW9HfpAgb6B6KAClQTvGqzvV49b7XcLBujAM4/exec'; // Paste Link Here
  let allData = { settings: {}, groups: [], exams: [] };
  let currentExamId = null;

  async function fetchData() {
    const res = await fetch(SCRIPT_URL + "?action=getHome");
    allData = await res.json();
    
    document.getElementById('footerText').innerText = allData.settings.footer_text || '© SKULiKA';
    const wa = document.getElementById('waBubble');
    wa.href = allData.settings.whatsapp_link || '#';
    wa.style.display = 'grid';
  }

  async function navigate(page, id = null) {
    const app = document.getElementById('appContent');
    app.innerHTML = '<p>Loading...</p>';
    
    if (page === 'home') await renderHome();
    else if (page === 'group') await renderGroupDetails(id);
    else if (page === 'admin') renderAdminLogin();
    else if (page === 'about' || page === 'contact' || page === 'privacy' || page === 'terms') renderStaticPage(page);
    else if (page === 'comments') await renderComments(id);
    window.scrollTo(0, 0);
  }

  async function renderHome() {
    let html = '<div class="hero"><h1>Mitihani & Notes</h1><p>Pakua mitihani ya mikoa tofauti kwa urahisi.</p></div><div class="container" style="padding-top:2rem;">';
    if (!allData.groups || allData.groups.length === 0) {
      html += '<p style="text-align:center; color:var(--text-light);">Hakuna mitihani kwa sasa.</p>';
    } else {
      allData.groups.forEach(g => {
        html += `<div class="group-card"><h3 style="cursor:pointer; color:var(--primary);" onclick="navigate('group', '${g.id}')">${g.title}</h3><p style="color:var(--text-light); font-size:0.9rem;">${g.description || ''}</p><button class="btn-sm btn-view" style="margin-top:1rem;" onclick="navigate('group', '${g.id}')">View Exams <i class="fas fa-arrow-right"></i></button></div>`;
      });
    }
    html += '</div>';
    document.getElementById('appContent').innerHTML = html;
  }

  async function renderGroupDetails(groupId) {
    const group = allData.groups.find(g => String(g.id) === String(groupId));
    const exams = allData.exams.filter(e => String(e.group_id) === String(groupId));
    
    let html = `<div class="container" style="padding-top:2rem;"><button onclick="navigate('home')" style="background:none; border:none; color:var(--primary); cursor:pointer; margin-bottom:1rem;">&larr; Back</button><h2>${group.title}</h2><p style="color:var(--text-light); margin-bottom:2rem;">${group.description || ''}</p>`;
    
    if (exams.length === 0) html += '<p>No exams added yet.</p>';
    else {
      html += '<table><thead><tr><th>Region</th><th>Year</th><th>Views</th><th>Downloads</th><th>Actions</th></tr></thead><tbody>';
      exams.forEach(ex => {
        html += `<tr><td style="font-weight:600;">${ex.region}</td><td>${ex.year || 'N/A'}</td><td>${ex.views || 0}</td><td>${ex.downloads || 0}</td><td>
          <button class="btn-sm btn-view" onclick="openModal('${ex.file_id}', '${ex.id}')"><i class="fas fa-book-open"></i> Read</button>
          <a href="${ex.download_url}" class="btn-sm btn-download" target="_blank" onclick="incrementStat('${ex.id}', 'download')"><i class="fas fa-download"></i> Download</a>
          <button class="btn-sm btn-view" onclick="navigate('comments', '${ex.id}')"><i class="fas fa-comments"></i> Comments</button>
        </td></tr>`;
      });
      html += '</tbody></table>';
    }
    html += '</div>';
    document.getElementById('appContent').innerHTML = html;
  }

  async function openModal(fileId, examId) {
    document.getElementById('modalIframe').src = "https://drive.google.com/file/d/" + fileId + "/preview";
    document.getElementById('readModal').style.display = 'flex';
    incrementStat(examId, 'view');
  }
  function closeModal() { document.getElementById('readModal').style.display = 'none'; document.getElementById('modalIframe').src = ''; }

  async function incrementStat(examId, type) {
    await fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify({ action: "incrementStat", examId: examId, type: type }) });
  }

  async function renderStaticPage(page) {
    let title = page.charAt(0).toUpperCase() + page.slice(1).replace(/([A-Z])/g, ' $1');
    let content = allData.settings[page] || 'Content not available.';
    document.getElementById('appContent').innerHTML = `<div class="container" style="padding-top:2rem;"><h2 style="margin-bottom:1rem;">${title}</h2><div class="group-card"><p style="white-space: pre-wrap;">${content}</p></div></div>`;
  }

  // --- COMMENTS ---
  async function renderComments(examId) {
    currentExamId = examId;
    const res = await fetch(SCRIPT_URL + "?action=getComments&examId=" + examId);
    const comments = await res.json();
    
    let html = `<div class="container" style="padding-top:2rem;"><button onclick="history.back()" style="background:none; border:none; color:var(--primary); cursor:pointer; margin-bottom:1rem;">&larr; Back</button><h2>Comments</h2>
      <div class="group-card" style="margin:1.5rem 0;"><h4>Leave a Comment</h4>
      <div class="form-group"><input type="text" id="cName" class="form-input" placeholder="Your Name"></div>
      <div class="form-group"><textarea id="cText" class="form-input" rows="3" placeholder="Your Comment..."></textarea></div>
      <button class="btn-sm btn-download" onclick="postComment()">Post Comment</button></div>`;
    
    if (comments.length === 0) html += '<p>No comments yet.</p>';
    comments.forEach(c => { html += `<div class="comment-box"><div class="comment-author">${c.name}</div><p style="font-size:0.9rem; margin-top:0.2rem;">${c.comment}</p></div>`; });
    html += '</div>';
    document.getElementById('appContent').innerHTML = html;
  }

  async function postComment() {
    const name = document.getElementById('cName').value;
    const comment = document.getElementById('cText').value;
    if (!name || !comment) return alert('Please fill all fields.');
    await fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify({ action: "postComment", examId: currentExamId, name: name, comment: comment }) });
    alert('Comment posted!');
    renderComments(currentExamId);
  }

  // --- ADMIN DASHBOARD ---
  let isAdmin = false;
  function renderAdminLogin() {
    if (isAdmin) return renderAdminDashboard();
    document.getElementById('appContent').innerHTML = `<div class="container" style="max-width:400px; padding-top:4rem; text-align:center;"><div class="group-card"><h2>Admin Login</h2><input type="password" id="adminPass" class="form-input" placeholder="Password" style="margin:1rem 0;"><button class="btn-admin" style="width:100%;" onclick="checkAdmin()">Login</button></div></div>`;
  }
  function checkAdmin() {
    if (document.getElementById('adminPass').value === 'skulika-admin') { isAdmin = true; renderAdminDashboard(); }
    else { alert('Wrong password!'); }
  }

  function renderAdminDashboard() {
    document.getElementById('appContent').innerHTML = `
      <div class="container" style="padding-top:2rem;">
        <h2 style="margin-bottom:1.5rem;">Admin Dashboard</h2>
        <div class="admin-grid">
          <div class="admin-sidebar">
            <button class="active" onclick="showTab('stats', this)">Statistics</button>
            <button onclick="showTab('groups', this)">Manage Groups</button>
            <button onclick="showTab('upload', this)">Upload Exam</button>
            <button onclick="showTab('settings', this)">Site Settings</button>
          </div>
          <div id="adminContent">
            <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:1rem;">
              <div class="stat-box"><h2>${allData.groups.length}</h2><p>Groups</p></div>
              <div class="stat-box"><h2>${allData.exams.length}</h2><p>Exams</p></div>
              <div class="stat-box"><h2>${allData.exams.reduce((a,b)=>a+(b.views||0),0)}</h2><p>Total Views</p></div>
            </div>
          </div>
        </div>
      </div>`;
  }

  function showTab(tab, btn) {
    document.querySelectorAll('.admin-sidebar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    let html = '';

    if (tab === 'stats') {
      html = `<div style="display:grid; grid-template-columns:repeat(3,1fr); gap:1rem;">
        <div class="stat-box"><h2>${allData.groups.length}</h2><p>Groups</p></div><div class="stat-box"><h2>${allData.exams.length}</h2><p>Exams</p></div><div class="stat-box"><h2>${allData.exams.reduce((a,b)=>a+(b.views||0),0)}</h2><p>Total Views</p></div></div>`;
    } 
    else if (tab === 'groups') {
      html = `<div class="group-card"><h3>Create New Group (e.g., MOCK 2026)</h3><div class="form-group"><label>Title</label><input type="text" id="gTitle" class="form-input"></div><div class="form-group"><label>Description</label><textarea id="gDesc" class="form-input"></textarea></div><button class="btn-admin" onclick="createGroup()">Create Group</button></div><div id="groupList" style="margin-top:2rem;"></div>`;
      document.getElementById('adminContent').innerHTML = html;
      loadAdminGroupsList();
      return;
    } 
    else if (tab === 'upload') {
      let opts = allData.groups.map(g => `<option value="${g.id}">${g.title}</option>`).join('');
      html = `<div class="group-card"><h3>Upload New Exam</h3>
        <div class="form-group"><label>Select Group</label><select id="uGroup" class="form-input">${opts}</select></div>
        <div class="form-group"><label>Region (Mkoa)</label><input type="text" id="uRegion" class="form-input" placeholder="Mtwara"></div>
        <div class="form-group"><label>Year</label><input type="number" id="uYear" class="form-input" placeholder="2026"></div>
        <div class="form-group"><label>File (PDF, Word, Excel)</label>
          <div class="file-drop" onclick="document.getElementById('uFile').click()">
            <i class="fas fa-cloud-upload-alt" style="font-size:2rem; color:var(--primary);"></i>
            <p id="uFileName">Click to select file</p>
            <input type="file" id="uFile" style="display:none" onchange="document.getElementById('uFileName').innerText=this.files[0].name">
          </div>
        </div>
        <button class="btn-admin" id="uploadBtn" onclick="uploadExam()">Upload & Publish</button>
      </div>`;
    } 
    else if (tab === 'settings') {
      let s = allData.settings;
      html = `<div class="group-card"><h3>Site Settings</h3>
        <div class="form-group"><label>WhatsApp Link</label><input type="text" id="sWa" class="form-input" value="${s.whatsapp_link || ''}"></div>
        <div class="form-group"><label>About Us</label><textarea id="sAbout" class="form-input" rows="3">${s.about_us || ''}</textarea></div>
        <div class="form-group"><label>Contact Us</label><textarea id="sContact" class="form-input" rows="3">${s.contact_us || ''}</textarea></div>
        <div class="form-group"><label>Privacy Policy</label><textarea id="sPrivacy" class="form-input" rows="3">${s.privacy_policy || ''}</textarea></div>
        <div class="form-group"><label>Terms of Service</label><textarea id="sTerms" class="form-input" rows="3">${s.terms_of_service || ''}</textarea></div>
        <div class="form-group"><label>Footer Text</label><input type="text" id="sFooter" class="form-input" value="${s.footer_text || ''}"></div>
        <button class="btn-admin" onclick="saveSettings()">Save Settings</button>
      </div>`;
    }
    document.getElementById('adminContent').innerHTML = html;
  }

  async function loadAdminGroupsList() {
    let html = '<h3>Existing Groups</h3>';
    allData.groups.forEach(g => {
      html += `<div class="group-card" style="display:flex; justify-content:space-between; align-items:center;"><div><strong>${g.title}</strong><br><small>${g.description}</small></div></div>`;
    });
    document.getElementById('groupList').innerHTML = html;
  }

  async function createGroup() {
    await fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify({ action: "createGroup", title: document.getElementById('gTitle').value, description: document.getElementById('gDesc').value }) });
    alert('Group Created! Refreshing data...');
    await fetchData(); renderAdminDashboard(); showTab('groups', document.querySelector('.admin-sidebar button:nth-child(2)'));
  }

  async function uploadExam() {
    const fileInput = document.getElementById('uFile');
    if (!fileInput.files.length) return alert('Select a file!');
    const btn = document.getElementById('uploadBtn');
    btn.disabled = true; btn.innerText = "Uploading...";
    
    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.onload = async function() {
      const base64 = reader.result.split(',')[1];
      const payload = { action: "uploadExam", groupId: document.getElementById('uGroup').value, region: document.getElementById('uRegion').value, year: document.getElementById('uYear').value, fileName: file.name, mimeType: file.type, fileData: base64 };
      
      await fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload) });
      alert('Exam Uploaded Successfully!');
      await fetchData(); 
      btn.disabled = false; btn.innerText = "Upload & Publish";
      document.getElementById('uFileName').innerText = "Click to select file";
    };
    reader.readAsDataURL(file);
  }

  async function saveSettings() {
    const payload = { action: "saveSettings", whatsapp_link: document.getElementById('sWa').value, about_us: document.getElementById('sAbout').value, contact_us: document.getElementById('sContact').value, privacy_policy: document.getElementById('sPrivacy').value, terms_of_service: document.getElementById('sTerms').value, footer_text: document.getElementById('sFooter').value };
    await fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload) });
    alert('Settings Saved!');
    await fetchData();
  }

  // --- INIT ---
  window.onload = async function() {
    await fetchData();
    navigate('home');
  };
</script>
</body>
</html>
