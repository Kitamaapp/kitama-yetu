<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SKULiKA | Notes for Form I to Form VI</title>
<meta name="description" content="SKULiKA - Download and read notes for Form I, II, III, IV, V and VI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --tanzania-green: #1eb53a; --tanzania-yellow: #fcd116; --tanzania-blue: #00a3dd;
    --tanzania-black: #1a1a1a; --bg-color: #f4f7f6; --surface: #ffffff;
    --text-dark: #222; --text-light: #555; --text-mute: #888; --border: #e1e5e4;
    --shadow: 0 4px 15px rgba(0,0,0,0.05); --shadow-hover: 0 8px 25px rgba(0,0,0,0.08);
  }
  body.dark-mode { --bg-color: #121212; --surface: #1e1e1e; --text-dark: #f1f1f1; --text-light: #b0b0b0; --text-mute: #777; --border: #333; --shadow: 0 4px 15px rgba(0,0,0,0.3); --shadow-hover: 0 8px 25px rgba(0,0,0,0.5); }
  body.texture-light { background-color: #f4f7f6; background-image: radial-gradient(#dfe4ea 1px, transparent 1px); background-size: 20px 20px; }
  body.texture-ocean { background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); }
  body.texture-forest { background: linear-gradient(135deg, #e6f7e6 0%, #d4e9d4 100%); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow-x: hidden !important; max-width: 100%; width: 100%; }
  body { font-family: 'Open Sans', sans-serif; background: var(--bg-color); color: var(--text-dark); line-height: 1.6; transition: background 0.3s, color 0.3s; }
  h1, h2, h3, h4, h5 { font-family: 'Poppins', sans-serif; }
  a { text-decoration: none; color: var(--tanzania-blue); }

  header { background: var(--surface); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 1000; border-top: 4px solid var(--tanzania-green); width: 100%; }
  .nav-container { max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
  .logo { display: flex; align-items: center; gap: 0.5rem; font-family: 'Poppins', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--tanzania-green); cursor: pointer; }
  .logo span { color: var(--tanzania-blue); }
  .nav-links { display: flex; gap: 1.5rem; list-style: none; align-items: center; }
  .nav-links a { color: var(--text-dark); font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: color 0.3s; }
  .nav-links a:hover { color: var(--tanzania-blue); }
  .nav-actions { display: flex; gap: 1rem; align-items: center; }
  .theme-toggle { background: var(--bg-color); border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; color: var(--text-light); display: grid; place-items: center; }
  .btn-admin { background: var(--tanzania-green); color: #fff; padding: 0.5rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; }
  .mobile-menu-btn { background: none; border: 1px solid var(--border); width: 36px; height: 36px; border-radius: 4px; font-size: 1.2rem; color: var(--tanzania-green); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .mobile-nav { display: none; flex-direction: column; background: var(--surface); padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); }
  .mobile-nav.active { display: flex; animation: slideDown 0.3s ease; }
  .mobile-nav a { padding: 0.75rem 0; color: var(--text-dark); border-bottom: 1px solid var(--border); cursor: pointer; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  .page-wrapper { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; min-height: 70vh; width: 100%; }
  .hero { background: linear-gradient(135deg, var(--tanzania-green) 0%, #16a34a 100%); color: #fff; text-align: center; padding: 3rem 1.5rem; border-radius: 12px; margin-bottom: 2rem; width: 100%; }
  .hero h1 { font-size: 2.2rem; margin-bottom: 0.5rem; color: #fff; }

  .top-search-bar { width: 100%; margin-bottom: 2rem; }
  .search-box { display: flex; width: 100%; max-width: 800px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 50px; overflow: hidden; box-shadow: var(--shadow); }
  .search-box input { flex: 1; border: none; padding: 1rem 1.5rem; outline: none; background: transparent; color: var(--text-dark); font-size: 1rem; min-width: 0; }
  .search-box button { background: var(--tanzania-green); color: #fff; border: none; padding: 0 2rem; cursor: pointer; font-weight: 600; }

  .layout-grid { display: grid; grid-template-columns: 1fr 300px; gap: 2rem; width: 100%; }
  .main-content { min-width: 0; width: 100%; }
  .section-divider { font-size: 1.4rem; color: var(--tanzania-black); border-left: 5px solid var(--tanzania-green); padding-left: 1rem; margin-bottom: 1.5rem; margin-top: 2rem; }
  body.dark-mode .section-divider { color: var(--text-dark); }
  
  .form-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; background: var(--surface); padding: 1rem; border-radius: 8px; box-shadow: var(--shadow); width: 100%; }
  .form-tab { padding: 0.5rem 1rem; background: #f1f5f4; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-weight: 600; color: var(--text-light); transition: all 0.3s; font-size: 0.9rem; }
  .form-tab.active, .form-tab:hover { background: var(--tanzania-green); color: #fff; border-color: var(--tanzania-green); }

  /* Darasahuru / Unislides Perfect Layout */
  .note-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.2rem; margin-bottom: 1.5rem; display: flex; flex-direction: column; box-shadow: var(--shadow); width: 100%; transition: box-shadow 0.3s; }
  .note-item:hover { box-shadow: var(--shadow-hover); }
  .note-item.expanded .note-expanded { display: block; animation: fadeIn 0.3s; }
  .note-item.expanded .post-thumb { display: none; } 
  .note-item.expanded .note-content { width: 100%; }
  .note-item.expanded .post-chevron i { transform: rotate(180deg); }
  
  .note-collapsed { display: flex; flex-direction: row; align-items: flex-start; gap: 1.2rem; cursor: pointer; width: 100%; }
  
  .post-thumb { width: 140px; height: 100px; flex-shrink: 0; border-radius: 6px; overflow: hidden; background: #f1f5f4; display: flex; align-items: center; justify-content: center; }
  .post-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .file-icon-box { width: 100%; height: 100%; border-radius: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; font-weight: 700; font-size: 0.8rem; }
  .file-icon-box i { font-size: 1.5rem; margin-bottom: 0.2rem; }
  .pdf { background: #e74c3c; } .docx { background: #2980b9; } .pptx { background: #d35400; } .xlsx { background: #27ae60; } .txt { background: #7f8c8d; }
  
  .note-content { flex: 1; min-width: 0; width: 100%; word-wrap: break-word; overflow-wrap: break-word; }
  
  /* TITLE FIXED TO SHOW FULLY WITHOUT CUTTING */
  .note-content h3 { 
    font-size: 1.05rem; 
    margin-bottom: 0.5rem; 
    color: var(--tanzania-black); 
    line-height: 1.4; 
    word-wrap: break-word; 
    overflow-wrap: break-word;
  }
  body.dark-mode .note-content h3 { color: var(--text-dark); }
  
  .post-info-line { display: flex; gap: 0.8rem; font-size: 0.8rem; color: var(--text-mute); flex-wrap: wrap; align-items: center; }
  .post-info-line span { display: flex; align-items: center; gap: 0.3rem; }
  .post-info-line .badge { background: rgba(30, 181, 58, 0.1); color: var(--tanzania-green); padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; }
  
  .post-chevron { color: var(--text-mute); flex-shrink: 0; font-size: 0.9rem; padding-left: 1rem; margin-top: 0.5rem; }
  .post-chevron i { transition: transform 0.3s; }

  .note-expanded { display: none; padding-top: 1rem; margin-top: 1rem; border-top: 1px dashed var(--border); width: 100%; }
  .post-image-full { width: 100%; max-height: 350px; object-fit: cover; border-radius: 8px; margin-bottom: 1rem; }
  .note-desc-full { font-size: 0.95rem; color: var(--text-light); margin-bottom: 1rem; line-height: 1.7; }
  
  .note-expanded-tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .tag { padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
  .tag-subject { background: #e6f0f5; color: var(--tanzania-blue); }
  .tag-type { background: #eee; color: var(--text-mute); }
  body.dark-mode .tag-type { background: #333; }
  
  .note-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1rem; }
  .btn-sm { padding: 0.5rem 1rem; text-align: center; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 0.4rem; text-decoration: none; }
  .btn-view { background: #eef4f8; color: var(--tanzania-blue); }
  .btn-download { background: var(--tanzania-green); color: #fff; }

  .group-section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); margin-bottom: 1.5rem; width: 100%; }
  .group-header { font-size: 1.2rem; color: #fff; background: var(--tanzania-green); padding: 0.8rem 1.5rem; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
  table { width: 100%; border-collapse: collapse; table-layout: auto; }
  th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; word-wrap: break-word; }
  th { background: var(--bg-color); color: var(--text-light); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; white-space: nowrap; }
  .region-row td { background: var(--tanzania-blue) !important; color: #fff !important; font-weight: 700; border-top: 2px solid var(--tanzania-green); border-bottom: 2px solid var(--tanzania-green); }

  .comment-container { margin-top: 1.5rem; border-top: 2px dashed var(--border); padding-top: 1rem; width: 100%; }
  .comment-box { background: var(--bg-color); padding: 1rem; border-radius: 6px; margin-bottom: 0.5rem; border-left: 3px solid var(--tanzania-green); width: 100%; }

  .sidebar { display: flex; flex-direction: column; gap: 2rem; width: 100%; }
  .widget { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; box-shadow: var(--shadow); width: 100%; }
  .widget-title { font-size: 1.1rem; color: var(--tanzania-black); border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
  body.dark-mode .widget-title { color: var(--text-dark); }
  .widget-title i { color: var(--tanzania-green); }
  .labels-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .label-tag { background: #f1f5f4; padding: 0.3rem 0.8rem; border-radius: 50px; font-size: 0.85rem; color: var(--text-dark); cursor: pointer; border: 1px solid var(--border); }
  body.dark-mode .label-tag { background: var(--bg-color); }
  .label-tag:hover, .label-tag.active { background: var(--tanzania-green); color: #fff; border-color: var(--tanzania-green); }

  .admin-grid { display: grid; grid-template-columns: 220px 1fr; gap: 2rem; width: 100%; }
  .admin-sidebar { background: var(--surface); padding: 1rem; border-radius: 8px; border: 1px solid var(--border); height: fit-content; }
  .admin-sidebar button { display: block; width: 100%; text-align: left; padding: 0.75rem; background: none; border: none; cursor: pointer; font-weight: 500; color: var(--text-dark); border-radius: 6px; }
  .admin-sidebar button:hover, .admin-sidebar button.active { background: var(--tanzania-green); color: #fff; }
  .stat-box { background: var(--surface); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border); text-align: center; box-shadow: var(--shadow); }
  .stat-box h2 { font-size: 1.8rem; color: var(--tanzania-green); }
  .form-group { margin-bottom: 1rem; width: 100%; }
  .form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.3rem; }
  .form-input { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-family: 'Open Sans', sans-serif; background: var(--bg-color); color: var(--text-dark); }
  .file-drop { padding: 2rem; border: 2px dashed var(--border); border-radius: 8px; text-align: center; cursor: pointer; color: var(--text-light); background: var(--bg-color); width: 100%; }

  .wa-bubble { position: fixed; bottom: 20px; right: 20px; background: #25D366; color: #fff; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-size: 1.8rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 999; animation: pulse 2s infinite; }
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 1rem; }
  .modal-overlay.active { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); } }

  @media (max-width: 900px) { 
    .layout-grid { grid-template-columns: 1fr; } 
    .sidebar { order: 2; } 
    .nav-links { display: none; } 
    .admin-grid { grid-template-columns: 1fr; } 
  }
  @media (max-width: 600px) { 
    .post-thumb { width: 100px; height: 80px; } 
    .note-content h3 { font-size: 0.95rem; }
    .hero h1 { font-size: 1.6rem; }
    .col-type, .col-year { display: none; } 
  }
</style>
</head>
<body>

<header>
  <div class="nav-container">
    <div class="logo" onclick="navigate('home')"><i class="fas fa-graduation-cap"></i> SKU<span>L</span>iKA</div>
    <ul class="nav-links">
      <li><a onclick="navigate('home')">Home</a></li>
      <li><a onclick="navigate('about')">About Us</a></li>
      <li><a onclick="navigate('contact')">Contact</a></li>
      <li><a onclick="navigate('privacy')">Privacy</a></li>
      <li><a onclick="navigate('terms')">Terms</a></li>
    </ul>
    <div class="nav-actions">
      <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i></button>
      <button class="btn-admin" onclick="navigate('admin')">Admin</button>
      <button class="mobile-menu-btn" onclick="document.getElementById('mobileNav').classList.toggle('active')"><i class="fas fa-bars"></i></button>
    </div>
  </div>
  <div class="mobile-nav" id="mobileNav">
    <a onclick="navigate('home')">Home</a><a onclick="navigate('about')">About Us</a><a onclick="navigate('contact')">Contact</a><a onclick="navigate('privacy')">Privacy</a><a onclick="navigate('terms')">Terms</a><a onclick="navigate('admin')">Admin Login</a>
  </div>
</header>

<div id="appContent" class="page-wrapper"></div>
<a id="waBubble" class="wa-bubble" href="#" target="_blank" style="display: none;"><i class="fab fa-whatsapp"></i></a>

<div class="modal-overlay" id="readModal">
  <div style="background:var(--surface); width:100%; max-width:900px; height:90vh; border-radius:10px; overflow:hidden; display:flex; flex-direction:column;">
    <div style="background:var(--tanzania-green); color:#fff; padding:1rem 1.5rem; display:flex; justify-content:space-between;">
      <h3 style="color:#fff;">Document Preview</h3>
      <button onclick="closeModal()" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;">&times;</button>
    </div>
    <iframe id="modalIframe" style="width:100%; height:80vh; border:none;"></iframe>
    <div style="padding:1rem; text-align:right;">
      <a id="modalDownloadBtn" href="#" class="btn-sm btn-download" target="_blank"><i class="fas fa-download"></i> Download File</a>
    </div>
  </div>
</div>

<footer style="background: var(--tanzania-black); color: #fff; text-align: center; padding: 2rem 1.5rem; margin-top: 3rem;">
  <div style="height: 4px; background: linear-gradient(to right, var(--tanzania-green) 33%, var(--tanzania-yellow) 33% 66%, var(--tanzania-black) 66% 66.5%, var(--tanzania-blue) 66.5%); margin-bottom: 1.5rem;"></div>
  <p id="footerText" style="opacity: 0.8; font-size: 0.9rem;">© 2024 SKULiKA. Built for students and teachers in Tanzania.</p>
</footer>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwQhHYv_J32JGWDVz_hLJx44sMVc9ol5ohlwPLdPEUBKxQFucrknoV02PiSeuv3b1E/exec';
  let allData = { settings: {}, docs: [], groups: [] };
  let activeFilters = { form: "All", subject: "All", search: "" };

  async function fetchData() {
    try {
      const res = await fetch(SCRIPT_URL + "?action=getHome");
      allData = await res.json();
      document.getElementById('footerText').innerText = allData.settings.footer_text || '© 2024 SKULiKA';
      document.getElementById('waBubble').href = allData.settings.whatsapp_link || '#';
      document.getElementById('waBubble').style.display = 'grid';
      applyTheme();
    } catch (e) { console.error("Fetch Error:", e); }
  }

  function applyTheme() {
    document.body.classList.remove('texture-light', 'texture-ocean', 'texture-forest');
    let theme = allData.settings.bg_theme || 'texture-light';
    if (!document.body.classList.contains('dark-mode')) document.body.classList.add(theme);
  }

  async function navigate(page) {
    document.getElementById('mobileNav').classList.remove('active');
    const app = document.getElementById('appContent');
    app.innerHTML = '<p style="text-align:center; padding:5rem;">Loading...</p>';
    if (page === 'home') await renderHome();
    else if (page === 'admin') renderAdminLogin();
    else if (['about','contact','privacy','terms'].includes(page)) renderStaticPage(page);
    window.scrollTo(0, 0);
  }

  async function renderHome() {
    let docs = allData.docs.filter(d => {
      let matchForm = activeFilters.form === "All" || d.form === activeFilters.form;
      let matchSub = activeFilters.subject === "All" || d.subject === activeFilters.subject;
      let matchSearch = activeFilters.search === "" || (d.title && d.title.toLowerCase().includes(activeFilters.search)) || (d.subject && d.subject.toLowerCase().includes(activeFilters.search));
      return matchForm && matchSub && matchSearch;
    });

    let individualDocs = docs.filter(d => !d.group_id || d.group_id === "");
    let groupedDocs = docs.filter(d => d.group_id && d.group_id !== "");

    let groupsMap = {};
    groupedDocs.forEach(d => {
      let gId = d.group_id;
      if (!groupsMap[gId]) groupsMap[gId] = { title: "", regions: {} };
      let groupInfo = allData.groups.find(g => String(g.id) === String(gId));
      if (groupInfo) groupsMap[gId].title = groupInfo.title;
      let reg = d.region || "General";
      if (!groupsMap[gId].regions[reg]) groupsMap[gId].regions[reg] = [];
      groupsMap[gId].regions[reg].push(d);
    });

    let categories = [
      { name: "Secondary School Notes" },
      { name: "Primary School Notes" },
      { name: "Examinations" },
      { name: "Secondary Books" },
      { name: "Primary Books" }
    ];

    let latestPosts = [...individualDocs].sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 6);
    let featuredPosts = [...individualDocs].sort((a, b) => ((b.views||0) + (b.downloads||0)) - ((a.views||0) + (a.downloads||0))).slice(0, 4);

    let isFiltering = activeFilters.form !== "All" || activeFilters.subject !== "All" || activeFilters.search !== "";

    let html = `
      <div class="hero"><h1>Welcome to SKULiKA</h1><p>Digital Library for Form I to Form VI Notes. Download or read online. PDF, Word, PowerPoint, Excel.</p></div>
      
      <div class="top-search-bar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search for notes, exams, subjects..." onkeyup="handleSearch(event)" value="${activeFilters.search}">
          <button onclick="searchManual()"><i class="fas fa-search"></i></button>
        </div>
      </div>

      <div class="layout-grid">
        <main class="main-content">
          <div class="form-tabs">
            <button class="form-tab ${activeFilters.form === 'All' ? 'active' : ''}" onclick="setFilter('form','All')">All Forms</button>
            <button class="form-tab ${activeFilters.form === 'Form I' ? 'active' : ''}" onclick="setFilter('form','Form I')">Form I</button>
            <button class="form-tab ${activeFilters.form === 'Form II' ? 'active' : ''}" onclick="setFilter('form','Form II')">Form II</button>
            <button class="form-tab ${activeFilters.form === 'Form III' ? 'active' : ''}" onclick="setFilter('form','Form III')">Form III</button>
            <button class="form-tab ${activeFilters.form === 'Form IV' ? 'active' : ''}" onclick="setFilter('form','Form IV')">Form IV</button>
            <button class="form-tab ${activeFilters.form === 'Form V' ? 'active' : ''}" onclick="setFilter('form','Form V')">Form V</button>
            <button class="form-tab ${activeFilters.form === 'Form VI' ? 'active' : ''}" onclick="setFilter('form','Form VI')">Form VI</button>
          </div>
    `;

    if (isFiltering) {
      html += `<h2 class="section-divider">Search Results</h2>`;
      if (individualDocs.length === 0 && Object.keys(groupsMap).length === 0) {
        html += '<p style="text-align:center; padding:2rem; color:var(--text-light);">No documents found matching your filters.</p>';
      } else {
        individualDocs.forEach(d => html += renderPostCard(d));
      }
    } else {
      if (Object.keys(groupsMap).length > 0) {
        html += `<h2 class="section-divider">Exam Groups</h2>`;
        for (let gId in groupsMap) {
          let g = groupsMap[gId];
          html += `<div class="group-section"><div class="group-header">${g.title}</div>
            <div class="table-wrap"><table><thead><tr><th>Subject</th><th class="col-type">Type</th><th class="col-year">Year</th><th>Action</th></tr></thead><tbody>`;
          for (let region in g.regions) {
            html += `<tr class="region-row"><td colspan="4"><i class="fas fa-map-marker-alt"></i> ${region}</td></tr>`;
            g.regions[region].forEach(ex => {
              html += `<tr><td>${ex.subject}</td><td class="col-type">${ex.type}</td><td class="col-year">${ex.year || 'N/A'}</td><td><button class="btn-sm btn-download" style="padding:0.4rem 0.8rem; font-size:0.8rem;" onclick="openModal('${ex.file_id}', '${ex.id}')"><i class="fas fa-book-open"></i> Read</button></td></tr>`;
            });
          }
          html += `</tbody></table></div>
            <div style="padding: 1rem 1.5rem; text-align:right; border-top: 1px solid var(--border);">
              <button class="btn-sm btn-view" onclick="toggleComments('${gId}', 'group-${gId}')"><i class="fas fa-comments"></i> Group Comments</button>
              <div id="comments-container-group-${gId}" style="display:none; margin-top:1rem; border-top:2px dashed var(--border); padding-top:1rem; text-align:left;"></div>
            </div>
          </div>`;
        }
      }

      if (featuredPosts.length > 0) {
        html += `<h2 class="section-divider">Featured Posts</h2>`;
        featuredPosts.forEach(d => html += renderPostCard(d));
      }

      if (latestPosts.length > 0) {
        html += `<h2 class="section-divider">Latest Posts</h2>`;
        latestPosts.forEach(d => html += renderPostCard(d));
      }

      categories.forEach(cat => {
        let catDocs = individualDocs.filter(d => d.category === cat.name);
        if (catDocs.length > 0) {
          html += `<h2 class="section-divider">${cat.name}</h2>`;
          catDocs.forEach(d => html += renderPostCard(d));
        }
      });

      if (individualDocs.length === 0 && Object.keys(groupsMap).length === 0) {
        html += '<p style="text-align:center; padding:2rem; color:var(--text-light);">No documents posted yet.</p>';
      }
    }

    html += `</main>
        <aside class="sidebar">
          <div class="widget">
            <h3 class="widget-title"><i class="fas fa-tags"></i> Subjects</h3>
            <div class="labels-list">
              ${[...new Set(allData.docs.map(d => d.subject).filter(Boolean))].map(s => `<span class="label-tag ${activeFilters.subject === s ? 'active' : ''}" onclick="setFilter('subject','${s}')">${s}</span>`).join('') || '<p>No subjects yet.</p>'}
            </div>
          </div>
          <div class="widget">
            <h3 class="widget-title"><i class="fas fa-info-circle"></i> About SKULiKA</h3>
            <p style="font-size: 0.9rem; color: var(--text-light); line-height: 1.7;">
              SKULiKA is an online platform that gives students and teachers the opportunity to access, read, and share school notes from Form I to Form VI.
            </p>
          </div>
        </aside>
      </div>`;
    
    document.getElementById('appContent').innerHTML = html;
  }

  function renderPostCard(d) {
    let icon = d.type === "PDF" ? '<i class="fas fa-file-pdf"></i>' : d.type === "DOCX" ? '<i class="fas fa-file-word"></i>' : d.type === "PPTX" ? '<i class="fas fa-file-powerpoint"></i>' : '<i class="fas fa-file"></i>';
    let dateStr = d.created_at ? new Date(d.created_at).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
    
    return `
      <div class="note-item" id="post-${d.id}">
        <div class="note-collapsed" onclick="toggleExpand('${d.id}')">
          <div class="post-thumb">
            ${d.image_url ? `<img src="${d.image_url}" alt="Thumbnail">` : `<div class="file-icon-box ${d.type.toLowerCase()}">${icon}<span>${d.type}</span></div>`}
          </div>
          <div class="note-content">
            <h3>${d.title}</h3>
            <div class="post-info-line">
              <span><i class="fas fa-user-edit"></i> SKULiKA</span>
              <span><i class="fas fa-calendar-alt"></i> ${dateStr}</span>
              ${d.form ? `<span class="badge">${d.form}</span>` : ''}
            </div>
          </div>
          <div class="post-chevron"><i class="fas fa-chevron-down"></i></div>
        </div>
        
        <div class="note-expanded">
          ${d.image_url ? `<img src="${d.image_url}" class="post-image-full" alt="Image">` : ''}
          <div class="note-expanded-tags">
            ${d.subject ? `<span class="tag tag-subject">${d.subject}</span>` : ''}
            ${d.region ? `<span class="tag tag-subject">${d.region}</span>` : ''}
            ${d.type ? `<span class="tag tag-type">${d.type}</span>` : ''}
          </div>
          <p class="note-desc-full">${d.description || ''}</p>
          <div class="note-actions">
            <button class="btn-sm btn-download" onclick="openModal('${d.file_id}', '${d.id}')"><i class="fas fa-book-open"></i> Read / Download</button>
            <button class="btn-sm btn-view" onclick="toggleComments('${d.id}', 'ind-${d.id}')"><i class="fas fa-comments"></i> Comments</button>
          </div>
          <div id="comments-container-ind-${d.id}" style="display:none; margin-top:1rem;"></div>
        </div>
      </div>`;
  }

  function toggleExpand(id) { document.getElementById('post-' + id).classList.toggle('expanded'); }
  function setFilter(key, val) { activeFilters[key] = val; renderHome(); }
  function handleSearch(e) { activeFilters.search = e.target.value.toLowerCase(); renderHome(); }
  function searchManual() { let val = document.getElementById('searchInput').value; activeFilters.search = val.toLowerCase(); renderHome(); }

  function openModal(fileId, examId) {
    document.getElementById('modalIframe').src = "https://drive.google.com/file/d/" + fileId + "/preview";
    document.getElementById('modalDownloadBtn').href = "https://drive.google.com/uc?export=download&id=" + fileId;
    document.getElementById('readModal').classList.add('active');
    fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify({ action: "incrementStat", examId: examId, type: "view" }) });
    document.getElementById('modalDownloadBtn').onclick = function() {
      fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify({ action: "incrementStat", examId: examId, type: "download" }) });
    };
  }
  function closeModal() { document.getElementById('readModal').classList.remove('active'); document.getElementById('modalIframe').src = ''; }

  async function toggleComments(id, prefix) {
    const container = document.getElementById('comments-container-' + prefix);
    if (container.style.display === 'block') { container.style.display = 'none'; return; }
    container.style.display = 'block';
    container.innerHTML = '<p>Loading comments...</p>';
    const res = await fetch(SCRIPT_URL + "?action=getComments&examId=" + id);
    const comments = await res.json();
    let html = `<div style="max-width: 600px; margin: 0 auto;">
        <h4>Leave a Comment</h4>
        <div class="form-group" style="margin-top:0.5rem;"><input type="text" id="cName-${prefix}" class="form-input" placeholder="Your Name"></div>
        <div class="form-group"><textarea id="cText-${prefix}" class="form-input" rows="2" placeholder="Write a comment..."></textarea></div>
        <button class="btn-sm btn-download" onclick="submitComment('${id}', '${prefix}')"><i class="fas fa-paper-plane"></i> Post</button>
        <div style="margin-top:1rem;">`;
    if (comments.length === 0) html += '<p style="font-size:0.85rem; color:var(--text-mute);">No comments yet.</p>';
    comments.forEach(c => {
      let date = new Date(c.created_at).toLocaleString();
      html += `<div class="comment-box"><div style="font-weight:700; font-size:0.85rem; color:var(--tanzania-green);">${c.name} <small style="color:var(--text-mute); font-weight:400;">(${date})</small></div><p style="font-size:0.9rem; margin-top:0.3rem;">${c.comment}</p></div>`;
    });
    html += `</div></div>`;
    container.innerHTML = html;
  }

  async function submitComment(id, prefix) {
    const name = document.getElementById('cName-' + prefix).value;
    const comment = document.getElementById('cText-' + prefix).value;
    if (!name || !comment) return alert('Please fill in your name and comment.');
    await fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify({ action: "postComment", examId: id, name: name, comment: comment }) });
    toggleComments(id, prefix); toggleComments(id, prefix);
  }

  function renderStaticPage(page) {
    let key = page;
    if (page === 'about') key = 'about_us';
    else if (page === 'contact') key = 'contact_us';
    else if (page === 'privacy') key = 'privacy_policy';
    else if (page === 'terms') key = 'terms_of_service';
    let title = page.charAt(0).toUpperCase() + page.slice(1);
    let content = allData.settings[key] || 'Content not available. Admin can edit this in Dashboard.';
    document.getElementById('appContent').innerHTML = `<div style="max-width: 800px; margin: 0 auto;"><div class="group-section"><div class="group-header">${title}</div><div style="padding:1.5rem;"><p style="white-space: pre-wrap;">${content}</p></div></div></div>`;
  }

  let isAdmin = false;
  function renderAdminLogin() {
    if (isAdmin) return renderAdminDashboard();
    document.getElementById('appContent').innerHTML = `<div style="max-width: 400px; margin: 0 auto;"><div class="group-section"><div class="group-header">Admin Login</div><div style="padding:1.5rem;"><input type="password" id="adminPass" class="form-input" placeholder="Password" style="margin-bottom:1rem;"><button class="btn-admin" style="width:100%;" onclick="checkAdmin()">Login</button></div></div></div>`;
  }
  function checkAdmin() { if (document.getElementById('adminPass').value === 'skulika-admin') { isAdmin = true; renderAdminDashboard(); } else { alert('Wrong!'); } }

  function renderAdminDashboard() {
    document.getElementById('appContent').innerHTML = `
      <div>
        <h2 style="margin-bottom:1.5rem; color:var(--tanzania-green);">Admin Dashboard</h2>
        <div class="admin-grid">
          <div class="admin-sidebar">
            <button class="active" onclick="showTab('stats', this)">Stats</button>
            <button onclick="showTab('groups', this)">Manage Groups</button>
            <button onclick="showTab('upload', this)">Upload Post</button>
            <button onclick="showTab('settings', this)">Site Settings</button>
          </div>
          <div id="adminContent"></div>
        </div>
      </div>`;
    showTab('stats', document.querySelector('.admin-sidebar button'));
  }

  function showTab(tab, btn) {
    document.querySelectorAll('.admin-sidebar button').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    let html = '';
    if (tab === 'stats') {
      let tv = allData.docs.reduce((a,b)=>a+(b.views||0),0);
      let td = allData.docs.reduce((a,b)=>a+(b.downloads||0),0);
      html = `<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:1rem; margin-bottom:2rem;">
        <div class="stat-box"><h2>${allData.docs.length}</h2><p>Posts</p></div>
        <div class="stat-box"><h2>${tv}</h2><p>Views</p></div>
        <div class="stat-box"><h2>${td}</h2><p>Downloads</p></div>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Title</th><th>Views</th><th>Downloads</th></tr></thead><tbody>`;
      allData.docs.forEach(d => { html += `<tr><td>${d.title}</td><td>${d.views||0}</td><td>${d.downloads||0}</td></tr>`; });
      html += `</tbody></table></div>`;
    } 
    else if (tab === 'groups') {
      html = `<div class="group-section"><div class="group-header">Create New Group</div><div style="padding:1.5rem;">
        <div class="form-group"><label>Group Title</label><input type="text" id="gTitle" class="form-input"></div>
        <div class="form-group"><label>Description</label><input type="text" id="gDesc" class="form-input"></div>
        <button class="btn-admin" onclick="createGroup()">Create</button></div></div>
      <div class="group-section" style="margin-top:1.5rem;"><div class="group-header">Existing Groups</div><div style="padding:1.5rem;" id="groupList"></div></div>`;
      document.getElementById('adminContent').innerHTML = html;
      loadAdminGroupsList();
      return;
    } 
    else if (tab === 'upload') {
      let groupOpts = allData.groups.map(g => `<option value="${g.id}">${g.title}</option>`).join('');
      html = `<div class="group-section"><div class="group-header">Upload New Document</div><div style="padding:1.5rem;">
        <div class="form-group"><label>Select Group</label><select id="uGroup" class="form-input"><option value="">None (Individual Post)</option>${groupOpts}</select></div>
        
        <div class="form-group"><label>Category / Section</label><select id="uCategory" class="form-input">
          <option value="Secondary School Notes">Secondary School Notes</option>
          <option value="Primary School Notes">Primary School Notes</option>
          <option value="Examinations">Examinations</option>
          <option value="Secondary Books">Secondary Books</option>
          <option value="Primary Books">Primary Books</option>
        </select></div>

        <div class="form-group"><label>Title</label><input type="text" id="uTitle" class="form-input"></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group"><label>Subject</label><input type="text" id="uSubject" class="form-input"></div>
          <div class="form-group"><label>Form</label><select id="uForm" class="form-input"><option value="">None</option><option>Form I</option><option>Form II</option><option>Form III</option><option>Form IV</option><option>Form V</option><option>Form VI</option></select></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group"><label>Type</label><select id="uType" class="form-input"><option>PDF</option><option>DOCX</option><option>PPTX</option><option>XLSX</option></select></div>
          <div class="form-group"><label>Year</label><input type="number" id="uYear" class="form-input"></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group"><label>Region</label><input type="text" id="uRegion" class="form-input"></div>
          <div class="form-group"><label>Exam Type</label><select id="uExamType" class="form-input"><option value="">Notes</option><option>Mock</option><option>Joint</option><option>Mid-term</option><option>Annual</option></select></div>
        </div>
        <div class="form-group"><label>Image URL (Optional)</label><input type="text" id="uImage" class="form-input" placeholder="https://example.com/image.jpg"></div>
        <div class="form-group"><label>Description</label><textarea id="uDesc" class="form-input" rows="3"></textarea></div>
        <div class="form-group"><label>File</label><div class="file-drop" onclick="document.getElementById('uFile').click()"><p id="uFileName">Click to select file</p><input type="file" id="uFile" style="display:none" onchange="document.getElementById('uFileName').innerText=this.files[0].name"></div></div>
        <button class="btn-admin" id="uploadBtn" onclick="uploadDoc()">Upload & Publish</button></div></div>`;
    } 
    else if (tab === 'settings') {
      let s = allData.settings;
      html = `<div class="group-section"><div class="group-header">Site Settings</div><div style="padding:1.5rem;">
        <div class="form-group"><label>Background Texture Theme</label><select id="sBgTheme" class="form-input">
          <option value="texture-light" ${s.bg_theme==='texture-light'?'selected':''}>Light Dots</option>
          <option value="texture-ocean" ${s.bg_theme==='texture-ocean'?'selected':''}>Ocean Blue</option>
          <option value="texture-forest" ${s.bg_theme==='texture-forest'?'selected':''}>Forest Green</option>
        </select></div>
        <div class="form-group"><label>WhatsApp Link</label><input type="text" id="sWa" class="form-input" value="${s.whatsapp_link || ''}"></div>
        <div class="form-group"><label>About Us</label><textarea id="sAbout" class="form-input" rows="3">${s.about_us || ''}</textarea></div>
        <div class="form-group"><label>Contact Us</label><textarea id="sContact" class="form-input" rows="3">${s.contact_us || ''}</textarea></div>
        <div class="form-group"><label>Privacy Policy</label><textarea id="sPrivacy" class="form-input" rows="3">${s.privacy_policy || ''}</textarea></div>
        <div class="form-group"><label>Terms of Service</label><textarea id="sTerms" class="form-input" rows="3">${s.terms_of_service || ''}</textarea></div>
        <div class="form-group"><label>Footer Text</label><input type="text" id="sFooter" class="form-input" value="${s.footer_text || ''}"></div>
        <button class="btn-admin" onclick="saveSettings()">Save Settings</button></div></div>`;
    }
    document.getElementById('adminContent').innerHTML = html;
  }

  async function loadAdminGroupsList() {
    let html = '';
    if (allData.groups.length === 0) html = '<p>No groups created.</p>';
    allData.groups.forEach(g => { html += `<div style="padding:0.5rem 0; border-bottom:1px solid #eee;"><strong>${g.title}</strong><br><small>${g.description || ''}</small></div>`; });
    document.getElementById('groupList').innerHTML = html;
  }

  async function createGroup() {
    await fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify({ action: "createGroup", title: document.getElementById('gTitle').value, description: document.getElementById('gDesc').value }) });
    alert('Group Created!'); await fetchData(); showTab('groups', document.querySelector('.admin-sidebar button:nth-child(2)'));
  }

  async function uploadDoc() {
    const fileInput = document.getElementById('uFile');
    if (!fileInput.files.length) return alert('Select a file!');
    const btn = document.getElementById('uploadBtn'); btn.disabled = true; btn.innerText = "Uploading...";
    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.onload = async function() {
      const base64 = reader.result.split(',')[1];
      const payload = { 
        action: "uploadDoc", 
        group_id: document.getElementById('uGroup').value, 
        category: document.getElementById('uCategory').value, 
        title: document.getElementById('uTitle').value, 
        subject: document.getElementById('uSubject').value, 
        form: document.getElementById('uForm').value, 
        type: document.getElementById('uType').value, 
        desc: document.getElementById('uDesc').value, 
        region: document.getElementById('uRegion').value, 
        exam_type: document.getElementById('uExamType').value, 
        year: document.getElementById('uYear').value, 
        image_url: document.getElementById('uImage').value, 
        fileName: file.name, mimeType: file.type, fileData: base64 
      };
      await fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload) });
      alert('Uploaded Successfully!');
      await fetchData(); btn.disabled = false; btn.innerText = "Upload & Publish"; navigate('home');
    };
    reader.readAsDataURL(file);
  }

  async function saveSettings() {
    const payload = { 
      action: "saveSettings", 
      whatsapp_link: document.getElementById('sWa').value, 
      about_us: document.getElementById('sAbout').value, 
      contact_us: document.getElementById('sContact').value, 
      privacy_policy: document.getElementById('sPrivacy').value, 
      terms_of_service: document.getElementById('sTerms').value, 
      footer_text: document.getElementById('sFooter').value, 
      bg_theme: document.getElementById('sBgTheme').value 
    };
    await fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload) });
    alert('Settings Saved!'); await fetchData(); navigate('home');
  }

  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    let icon = document.getElementById('themeIcon');
    if (document.body.classList.contains('dark-mode')) { icon.classList.remove('fa-moon'); icon.classList.add('fa-sun'); } 
    else { icon.classList.remove('fa-sun'); icon.classList.add('fa-moon'); applyTheme(); }
  }

  window.onload = async function() { await fetchData(); navigate('home'); };
</script>
</body>
</html>
