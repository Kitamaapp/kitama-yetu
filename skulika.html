<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SKULiKA | Educational Repository</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    --primary: #0f4c81; --primary-light: #3a6ea5; --accent: #1eb53a;
    --bg-color: #f8f9fa; --surface: #ffffff; --text-dark: #1a1a1a;
    --text-light: #555555; --text-mute: #888888; --border: #e1e5e8;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.04); --shadow-md: 0 8px 24px rgba(0,0,0,0.1);
    --radius: 12px;
  }
  body.dark-mode {
    --bg-color: #0f1115; --surface: #1a1d23; --text-dark: #f1f1f1;
    --text-light: #b0b0b0; --text-mute: #777777; --border: #2a2e36;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.3); --shadow-md: 0 8px 24px rgba(0,0,0,0.5);
  }
  /* Textures */
  body.texture-light { background-color: #f0f2f5; background-image: radial-gradient(#dfe4ea 1px, transparent 1px); background-size: 20px 20px; }
  body.texture-ocean { background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); }
  body.texture-forest { background: linear-gradient(135deg, #e6f7e6 0%, #d4e9d4 100%); }
  body.texture-geometric { background-color: #f0f4f8; background-image: linear-gradient(30deg, #e1e8f0 12%, transparent 12.5%, transparent 87%, #e1e8f0 87.5%, #e1e8f0), linear-gradient(150deg, #e1e8f0 12%, transparent 12.5%, transparent 87%, #e1e8f0 87.5%, #e1e8f0), linear-gradient(30deg, #e1e8f0 12%, transparent 12.5%, transparent 87%, #e1e8f0 87.5%, #e1e8f0), linear-gradient(150deg, #e1e8f0 12%, transparent 12.5%, transparent 87%, #e1e8f0 87.5%, #e1e8f0); background-size: 40px 70px; background-position: 0 0, 0 0, 20px 35px, 20px 35px; }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow-x: hidden; max-width: 100%; }
  body { font-family: 'Inter', sans-serif; color: var(--text-dark); line-height: 1.6; transition: background 0.3s, color 0.3s; }
  h1, h2, h3, h4 { font-family: 'Merriweather', serif; color: var(--text-dark); }
  a { text-decoration: none; color: var(--primary); }

  header { background: var(--surface); box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); }
  .nav-container { max-width: 1280px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
  .logo { display: flex; align-items: center; gap: 0.5rem; font-size: 1.3rem; font-weight: 700; color: var(--primary); cursor: pointer; }
  .logo i { color: var(--accent); }
  .nav-links { display: flex; gap: 1.5rem; list-style: none; align-items: center; }
  .nav-links a { color: var(--text-dark); font-weight: 500; font-size: 0.95rem; cursor: pointer; position: relative; transition: color 0.2s; }
  .nav-links a:hover { color: var(--accent); }
  .nav-links a::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--accent); transition: width 0.3s; }
  .nav-links a:hover::after { width: 100%; }
  .nav-actions { display: flex; gap: 0.75rem; align-items: center; }
  .theme-toggle { background: var(--bg-color); border: 1px solid var(--border); width: 38px; height: 38px; border-radius: 50%; cursor: pointer; color: var(--text-light); display: grid; place-items: center; transition: all 0.3s; }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }
  .btn-admin { background: var(--primary); color: #fff; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; transition: transform 0.2s; }
  .btn-admin:hover { transform: translateY(-2px); }
  .mobile-menu-btn { display: none; background: none; border: none; font-size: 1.5rem; color: var(--text-dark); cursor: pointer; }
  .mobile-nav { display: none; flex-direction: column; background: var(--surface); padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); }
  .mobile-nav.active { display: flex; animation: slideDown 0.3s ease; }
  .mobile-nav a { padding: 0.75rem 0; color: var(--text-dark); border-bottom: 1px solid var(--border); cursor: pointer; }

  .layout { max-width: 1280px; margin: 2rem auto; padding: 0 1.5rem; display: grid; grid-template-columns: 1fr 300px; gap: 2rem; }
  .hero { grid-column: 1 / -1; background: linear-gradient(135deg, var(--primary) 0%, #0a2e50 100%); color: #fff; padding: 4rem 1.5rem; text-align: center; border-radius: var(--radius); margin-bottom: 1.5rem; box-shadow: var(--shadow-md); animation: fadeIn 0.8s; }
  .hero h1 { color: #fff; font-size: clamp(1.8rem, 5vw, 2.5rem); margin-bottom: 0.5rem; }

  main { display: flex; flex-direction: column; gap: 1.5rem; }
  
  .group-section, .post-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow-sm); animation: fadeInUp 0.5s; }
  .post-card { display: flex; gap: 1rem; align-items: flex-start; transition: transform 0.3s, box-shadow 0.3s; }
  .post-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  
  .doc-icon { width: 50px; height: 60px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; font-weight: 700; font-size: 0.7rem; flex-shrink: 0; }
  .doc-icon i { font-size: 1.4rem; margin-bottom: 0.2rem; }
  .bg-pdf { background: #e74c3c; } .bg-docx { background: #2980b9; } .bg-pptx { background: #d35400; } .bg-xlsx { background: #27ae60; }
  
  .post-content { flex: 1; min-width: 0; word-wrap: break-word; }
  .post-meta { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
  .tag { background: var(--bg-color); color: var(--text-light); padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; border: 1px solid var(--border); }
  .post-title { font-size: 1.15rem; margin-bottom: 0.5rem; cursor: pointer; }
  .post-title:hover { color: var(--primary); }
  .post-desc { font-size: 0.9rem; color: var(--text-light); margin-bottom: 1rem; }
  
  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .btn-sm { padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 0.4rem; text-decoration: none; transition: all 0.2s; }
  .btn-action { background: var(--primary); color: #fff; }
  .btn-action:hover { background: var(--primary-light); transform: scale(1.03); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-dark); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

  /* Group Tables */
  .group-header { font-size: 1.3rem; color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 0.5rem; margin-bottom: 1rem; }
  .region-block { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px dashed var(--border); }
  .region-block:last-of-type { border-bottom: none; margin-bottom: 0; }
  .region-title { font-size: 1.1rem; color: var(--text-dark); margin-bottom: 0.75rem; font-weight: 700; padding-left: 0.5rem; border-left: 4px solid var(--accent); }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; min-width: 400px; }
  th, td { padding: 0.75rem; text-align: left; border: 1px solid var(--border); font-size: 0.9rem; }
  th { background: var(--accent); color: #fff; font-weight: 600; }
  tr:nth-child(even) { background: var(--bg-color); }
  tr:hover { background: rgba(15, 76, 129, 0.05); }

  .comment-container { margin-top: 1.5rem; border-top: 2px dashed var(--border); padding-top: 1.5rem; animation: fadeIn 0.3s; }
  .comment-box { background: var(--bg-color); padding: 1rem; border-radius: 6px; margin-bottom: 0.5rem; border-left: 3px solid var(--accent); }

  aside { display: flex; flex-direction: column; gap: 1.5rem; position: sticky; top: 90px; height: fit-content; }
  .sidebar-widget { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow-sm); }
  .widget-title { font-size: 0.9rem; font-weight: 700; text-transform: uppercase; color: var(--text-mute); margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
  .search-box { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .search-box input { flex: 1; border: none; padding: 0.75rem; outline: none; background: var(--bg-color); color: var(--text-dark); min-width: 0; }
  .search-box button { background: var(--primary); color: #fff; border: none; padding: 0 1rem; cursor: pointer; }
  .filter-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .filter-tag { background: var(--bg-color); padding: 0.4rem 0.9rem; border-radius: 50px; font-size: 0.85rem; color: var(--text-light); cursor: pointer; border: 1px solid var(--border); transition: all 0.2s; }
  .filter-tag:hover { border-color: var(--primary); color: var(--primary); }
  .filter-tag.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .admin-grid { display: grid; grid-template-columns: 220px 1fr; gap: 2rem; }
  .admin-sidebar button { display: block; width: 100%; text-align: left; padding: 0.75rem; background: none; border: none; cursor: pointer; font-weight: 500; color: var(--text-dark); border-radius: 6px; transition: all 0.2s; }
  .admin-sidebar button:hover, .admin-sidebar button.active { background: var(--bg-color); color: var(--primary); }
  .stat-box { background: var(--surface); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); text-align: center; transition: transform 0.3s; }
  .stat-box:hover { transform: scale(1.05); }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.3rem; }
  .form-input { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-dark); }
  .file-drop { padding: 2rem; border: 2px dashed var(--border); border-radius: 8px; text-align: center; cursor: pointer; color: var(--text-light); background: var(--bg-color); }

  .wa-bubble { position: fixed; bottom: 20px; right: 20px; background: #25D366; color: #fff; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-size: 1.8rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 999; animation: pulse 2s infinite; }
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 1rem; }
  .modal-overlay.active { display: flex; animation: fadeIn 0.3s; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); } }

  /* Mobile Responsiveness */
  @media (max-width: 900px) { 
    .layout { grid-template-columns: 1fr; } 
    aside { position: static; } 
    .nav-links { display: none; } 
    .mobile-menu-btn { display: block; } 
    .admin-grid { grid-template-columns: 1fr; } 
    .post-card { flex-direction: column; align-items: flex-start; gap: 1rem; }
    .post-content { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="nav-container">
    <div class="logo" onclick="navigate('home')"><i class="fas fa-graduation-cap"></i> SKU<i>KA</i></div>
    <ul class="nav-links">
      <li><a onclick="navigate('home')">Home</a></li>
      <li><a onclick="navigate('about')">About Us</a></li>
      <li><a onclick="navigate('contact')">Contact</a></li>
      <li><a onclick="navigate('privacy')">Privacy</a></li>
      <li><a onclick="navigate('terms')">Terms</a></li>
    </ul>
    <div class="nav-actions">
      <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i></button>
      <button class="btn-admin" onclick="navigate('admin')">Admin</button>
      <button class="mobile-menu-btn" onclick="document.getElementById('mobileNav').classList.toggle('active')"><i class="fas fa-bars"></i></button>
    </div>
  </div>
  <div class="mobile-nav" id="mobileNav">
    <a onclick="navigate('home')">Home</a><a onclick="navigate('about')">About Us</a><a onclick="navigate('contact')">Contact</a><a onclick="navigate('admin')">Admin Login</a>
  </div>
</header>

<div id="appContent" class="layout" style="min-height: 70vh;"></div>
<a id="waBubble" class="wa-bubble" href="#" target="_blank" style="display: none;"><i class="fab fa-whatsapp"></i></a>

<div class="modal-overlay" id="readModal">
  <div style="background:var(--surface); width:100%; max-width:900px; height:90vh; border-radius:10px; overflow:hidden; display:flex; flex-direction:column;">
    <div style="background:var(--primary); color:#fff; padding:1rem 1.5rem; display:flex; justify-content:space-between;">
      <h3 style="color:#fff;">Document Preview</h3>
      <button onclick="closeModal()" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;">&times;</button>
    </div>
    <iframe id="modalIframe" style="width:100%; height:80vh; border:none;"></iframe>
    <div style="padding:1rem; text-align:right;">
      <a id="modalDownloadBtn" href="#" class="btn-sm btn-action" target="_blank"><i class="fas fa-download"></i> Download File</a>
    </div>
  </div>
</div>

<footer style="background: var(--surface); border-top: 1px solid var(--border); padding: 2rem; text-align: center; margin-top: 3rem;">
  <p id="footerText" style="color: var(--text-light); font-size: 0.9rem;">© 2024 SKULiKA.</p>
</footer>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxSgwpZkEM7N0aIGFtLajz-3oIY1MKeMqB6Qu8fmCXezSfd4YP3ADFBHvQuyK4DK3c/exec';
  let allData = { settings: {}, docs: [], groups: [] };
  let activeFilters = { form: "All", subject: "All", search: "" };

  async function fetchData() {
    try {
      const res = await fetch(SCRIPT_URL + "?action=getHome");
      allData = await res.json();
      document.getElementById('footerText').innerText = allData.settings.footer_text || '© SKULiKA';
      document.getElementById('waBubble').href = allData.settings.whatsapp_link || '#';
      document.getElementById('waBubble').style.display = 'grid';
      applyTheme();
    } catch (e) { console.error("Fetch Error:", e); }
  }

  function applyTheme() {
    // Remove all texture classes
    document.body.classList.remove('texture-light', 'texture-ocean', 'texture-forest', 'texture-geometric');
    let theme = allData.settings.bg_theme || 'texture-light';
    if (!document.body.classList.contains('dark-mode')) {
      document.body.classList.add(theme);
    }
  }

  async function navigate(page) {
    document.getElementById('mobileNav').classList.remove('active');
    const app = document.getElementById('appContent');
    app.innerHTML = '<p style="text-align:center; padding:5rem;">Loading...</p>';
    if (page === 'home') await renderHome();
    else if (page === 'admin') renderAdminLogin();
    else if (['about','contact','privacy','terms'].includes(page)) renderStaticPage(page);
    window.scrollTo(0, 0);
  }

  async function renderHome() {
    let docs = allData.docs.filter(d => {
      let matchForm = activeFilters.form === "All" || d.form === activeFilters.form;
      let matchSub = activeFilters.subject === "All" || d.subject === activeFilters.subject;
      let matchSearch = activeFilters.search === "" || (d.title && d.title.toLowerCase().includes(activeFilters.search)) || (d.subject && d.subject.toLowerCase().includes(activeFilters.search));
      return matchForm && matchSub && matchSearch;
    });

    let individualDocs = docs.filter(d => !d.group_id || d.group_id === "");
    let groupedDocs = docs.filter(d => d.group_id && d.group_id !== "");

    let groupsMap = {};
    groupedDocs.forEach(d => {
      let gId = d.group_id;
      if (!groupsMap[gId]) groupsMap[gId] = { title: "", regions: {} };
      let groupInfo = allData.groups.find(g => String(g.id) === String(gId));
      if (groupInfo) groupsMap[gId].title = groupInfo.title;
      let reg = d.region || "General";
      if (!groupsMap[gId].regions[reg]) groupsMap[gId].regions[reg] = [];
      groupsMap[gId].regions[reg].push(d);
    });

    let html = `<div class="hero"><h1>Welcome to SKULiKA</h1><p>Access past papers, examinations, and notes for Form I to Form VI.</p></div><main>`;

    for (let gId in groupsMap) {
      let g = groupsMap[gId];
      html += `<div class="group-section"><h2 class="group-header">${g.title}</h2>`;
      
      for (let region in g.regions) {
        html += `<div class="region-block"><h3 class="region-title">${region}</h3>
          <div class="table-wrap"><table><thead><tr><th>Subject</th><th>Type</th><th>Year</th><th>Action</th></tr></thead><tbody>`;
        
        g.regions[region].forEach(ex => {
          html += `<tr>
            <td>${ex.subject}</td><td>${ex.type}</td><td>${ex.year || 'N/A'}</td>
            <td><button class="btn-sm btn-action" onclick="openModal('${ex.file_id}', '${ex.id}')"><i class="fas fa-book-open"></i> Read</button></td>
          </tr>`;
        });
        html += `</tbody></table></div></div>`;
      }
      
      // ONE Comment Section per Group
      html += `<div style="margin-top:1.5rem; text-align:right;">
        <button class="btn-sm btn-outline" onclick="toggleComments('${gId}', 'group-${gId}')"><i class="fas fa-comments"></i> Group Comments</button>
        <div id="comments-container-group-${gId}" style="display:none; margin-top:1rem; border-top:2px dashed var(--border); padding-top:1rem;"></div>
      </div>`;
      
      html += `</div>`;
    }

    if (individualDocs.length === 0 && Object.keys(groupsMap).length === 0) {
      html += '<p style="text-align:center; padding:2rem; color:var(--text-light);">No documents found.</p>';
    }
    individualDocs.forEach(d => {
      let icon = d.type === "PDF" ? '<i class="fas fa-file-pdf"></i>' : d.type === "DOCX" ? '<i class="fas fa-file-word"></i>' : d.type === "PPTX" ? '<i class="fas fa-file-powerpoint"></i>' : '<i class="fas fa-file"></i>';
      html += `
        <div class="post-card">
          <div class="doc-icon bg-${d.type.toLowerCase()}">${icon}<span>${d.type}</span></div>
          <div class="post-content">
            <div class="post-meta">
              ${d.form ? `<span class="tag">${d.form}</span>` : ''}
              ${d.subject ? `<span class="tag">${d.subject}</span>` : ''}
              ${d.region ? `<span class="tag">${d.region}</span>` : ''}
            </div>
            <h3 class="post-title" onclick="openModal('${d.file_id}', '${d.id}')">${d.title}</h3>
            <p class="post-desc">${d.description || ''}</p>
            <div class="actions">
              <button class="btn-sm btn-action" onclick="openModal('${d.file_id}', '${d.id}')"><i class="fas fa-book-open"></i> Read / Download</button>
              <button class="btn-sm btn-outline" onclick="toggleComments('${d.id}', 'ind-${d.id}')"><i class="fas fa-comments"></i> Comments</button>
            </div>
            <div id="comments-container-ind-${d.id}" style="display:none; margin-top:1rem; border-top:1px solid var(--border); padding-top:1rem;"></div>
          </div>
        </div>`;
    });
    html += `</main>

    <aside>
      <div class="sidebar-widget">
        <h3 class="widget-title">Search Library</h3>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search..." onkeyup="handleSearch(event)">
          <button onclick="searchManual()"><i class="fas fa-search"></i></button>
        </div>
      </div>
      <div class="sidebar-widget">
        <h3 class="widget-title">Forms</h3>
        <div class="filter-list">
          <span class="filter-tag ${activeFilters.form === 'All' ? 'active' : ''}" onclick="setFilter('form','All')">All</span>
          <span class="filter-tag" onclick="setFilter('form','Form I')">Form I</span>
          <span class="filter-tag" onclick="setFilter('form','Form II')">Form II</span>
          <span class="filter-tag" onclick="setFilter('form','Form III')">Form III</span>
          <span class="filter-tag" onclick="setFilter('form','Form IV')">Form IV</span>
          <span class="filter-tag" onclick="setFilter('form','Form V')">Form V</span>
          <span class="filter-tag" onclick="setFilter('form','Form VI')">Form VI</span>
        </div>
      </div>
      <div class="sidebar-widget">
        <h3 class="widget-title">Subjects</h3>
        <div class="filter-list">
          ${[...new Set(allData.docs.map(d => d.subject).filter(Boolean))].map(s => `<span class="filter-tag" onclick="setFilter('subject','${s}')">${s}</span>`).join('') || '<p>No subjects yet.</p>'}
        </div>
      </div>
    </aside>`;
    
    document.getElementById('appContent').innerHTML = html;
  }

  function setFilter(key, val) { activeFilters[key] = val; renderHome(); }
  function handleSearch(e) { activeFilters.search = e.target.value.toLowerCase(); renderHome(); }
  function searchManual() { let val = document.getElementById('searchInput').value; activeFilters.search = val.toLowerCase(); renderHome(); }

  function openModal(fileId, examId) {
    document.getElementById('modalIframe').src = "https://drive.google.com/file/d/" + fileId + "/preview";
    document.getElementById('modalDownloadBtn').href = "https://drive.google.com/uc?export=download&id=" + fileId;
    document.getElementById('readModal').classList.add('active');
    fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify({ action: "incrementStat", examId: examId, type: "view" }) });
    document.getElementById('modalDownloadBtn').onclick = function() {
      fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify({ action: "incrementStat", examId: examId, type: "download" }) });
    };
  }
  function closeModal() { document.getElementById('readModal').classList.remove('active'); document.getElementById('modalIframe').src = ''; }

  // Unified Comment Toggle (Works for both Group and Individual)
  async function toggleComments(id, prefix) {
    const container = document.getElementById('comments-container-' + prefix);
    if (container.style.display === 'block') { container.style.display = 'none'; return; }
    container.style.display = 'block';
    container.innerHTML = '<p>Loading comments...</p>';
    
    const res = await fetch(SCRIPT_URL + "?action=getComments&examId=" + id);
    const comments = await res.json();
    
    let html = `<div style="max-width: 600px; margin: 0 auto;">
        <h4>Leave a Comment</h4>
        <div class="form-group" style="margin-top:0.5rem;"><input type="text" id="cName-${prefix}" class="form-input" placeholder="Your Name"></div>
        <div class="form-group"><textarea id="cText-${prefix}" class="form-input" rows="2" placeholder="Write a comment..."></textarea></div>
        <button class="btn-sm btn-action" onclick="submitComment('${id}', '${prefix}')"><i class="fas fa-paper-plane"></i> Post</button>
        <div style="margin-top:1rem;">`;
    
    if (comments.length === 0) html += '<p style="font-size:0.85rem; color:var(--text-mute);">No comments yet.</p>';
    comments.forEach(c => {
      let date = new Date(c.created_at).toLocaleString();
      html += `<div class="comment-box"><div style="font-weight:700; font-size:0.85rem; color:var(--primary);">${c.name} <small style="color:var(--text-mute); font-weight:400;">(${date})</small></div><p style="font-size:0.9rem; margin-top:0.3rem;">${c.comment}</p></div>`;
    });
    html += `</div></div>`;
    container.innerHTML = html;
  }

  async function submitComment(id, prefix) {
    const name = document.getElementById('cName-' + prefix).value;
    const comment = document.getElementById('cText-' + prefix).value;
    if (!name || !comment) return alert('Please fill in your name and comment.');
    await fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify({ action: "postComment", examId: id, name: name, comment: comment }) });
    toggleComments(id, prefix); // Hide
    toggleComments(id, prefix); // Show & Refresh
  }

  function renderStaticPage(page) {
    let title = page.charAt(0).toUpperCase() + page.slice(1);
    let content = allData.settings[page] || 'Content not available.';
    document.getElementById('appContent').innerHTML = `<div style="grid-column: 1 / -1; max-width: 800px; margin: 2rem auto;"><h2>${title}</h2><div class="group-section"><p style="white-space: pre-wrap;">${content}</p></div></div>`;
  }

  let isAdmin = false;
  function renderAdminLogin() {
    if (isAdmin) return renderAdminDashboard();
    document.getElementById('appContent').innerHTML = `<div style="grid-column: 1 / -1; max-width: 400px; margin: 4rem auto;"><div class="group-section"><h2>Admin Login</h2><input type="password" id="adminPass" class="form-input" placeholder="Password" style="margin: 1rem 0;"><button class="btn-admin" style="width:100%;" onclick="checkAdmin()">Login</button></div></div>`;
  }
  function checkAdmin() { if (document.getElementById('adminPass').value === 'skulika-admin') { isAdmin = true; renderAdminDashboard(); } else { alert('Wrong!'); } }

  function renderAdminDashboard() {
    document.getElementById('appContent').innerHTML = `
      <div style="grid-column: 1 / -1;">
        <h2 style="margin-bottom:1.5rem;">Admin Dashboard</h2>
        <div class="admin-grid">
          <div class="admin-sidebar">
            <button class="active" onclick="showTab('stats', this)">Stats</button>
            <button onclick="showTab('groups', this)">Manage Groups</button>
            <button onclick="showTab('upload', this)">Upload Post</button>
            <button onclick="showTab('settings', this)">Site Settings</button>
          </div>
          <div id="adminContent"></div>
        </div>
      </div>`;
    showTab('stats', document.querySelector('.admin-sidebar button'));
  }

  function showTab(tab, btn) {
    document.querySelectorAll('.admin-sidebar button').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    let html = '';

    if (tab === 'stats') {
      let tv = allData.docs.reduce((a,b)=>a+(b.views||0),0);
      let td = allData.docs.reduce((a,b)=>a+(b.downloads||0),0);
      html = `<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:1rem; margin-bottom:2rem;">
        <div class="stat-box"><h2>${allData.docs.length}</h2><p>Posts</p></div>
        <div class="stat-box"><h2>${tv}</h2><p>Views</p></div>
        <div class="stat-box"><h2>${td}</h2><p>Downloads</p></div>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Title</th><th>Views</th><th>Downloads</th></tr></thead><tbody>`;
      allData.docs.forEach(d => { html += `<tr><td>${d.title}</td><td>${d.views||0}</td><td>${d.downloads||0}</td></tr>`; });
      html += `</tbody></table></div>`;
    } 
    else if (tab === 'groups') {
      html = `<div class="group-section"><h3>Create New Group</h3>
        <div class="form-group"><label>Group Title</label><input type="text" id="gTitle" class="form-input"></div>
        <div class="form-group"><label>Description</label><input type="text" id="gDesc" class="form-input"></div>
        <button class="btn-admin" onclick="createGroup()">Create</button></div>
      <div class="group-section"><h3>Existing Groups</h3><div id="groupList"></div></div>`;
      document.getElementById('adminContent').innerHTML = html;
      loadAdminGroupsList();
      return;
    } 
    else if (tab === 'upload') {
      let groupOpts = allData.groups.map(g => `<option value="${g.id}">${g.title}</option>`).join('');
      html = `<div class="group-section"><h3>Upload New Document</h3>
        <div class="form-group"><label>Select Group</label><select id="uGroup" class="form-input"><option value="">None (Individual Post)</option>${groupOpts}</select></div>
        <div class="form-group"><label>Title</label><input type="text" id="uTitle" class="form-input"></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group"><label>Subject</label><input type="text" id="uSubject" class="form-input"></div>
          <div class="form-group"><label>Form</label><select id="uForm" class="form-input"><option value="">None</option><option>Form I</option><option>Form II</option><option>Form III</option><option>Form IV</option><option>Form V</option><option>Form VI</option></select></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group"><label>Type</label><select id="uType" class="form-input"><option>PDF</option><option>DOCX</option><option>PPTX</option><option>XLSX</option></select></div>
          <div class="form-group"><label>Year</label><input type="number" id="uYear" class="form-input"></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group"><label>Region (Mkoa)</label><input type="text" id="uRegion" class="form-input"></div>
          <div class="form-group"><label>Exam Type</label><select id="uExamType" class="form-input"><option value="">Notes</option><option>Mock</option><option>Joint</option><option>Mid-term</option><option>Annual</option></select></div>
        </div>
        <div class="form-group"><label>Description</label><textarea id="uDesc" class="form-input" rows="3"></textarea></div>
        <div class="form-group"><label>File</label><div class="file-drop" onclick="document.getElementById('uFile').click()"><p id="uFileName">Click to select file</p><input type="file" id="uFile" style="display:none" onchange="document.getElementById('uFileName').innerText=this.files[0].name"></div></div>
        <button class="btn-admin" id="uploadBtn" onclick="uploadDoc()">Upload & Publish</button></div>`;
    } 
    else if (tab === 'settings') {
      let s = allData.settings;
      html = `<div class="group-section"><h3>Site Settings</h3>
        <div class="form-group"><label>Background Texture Theme</label><select id="sBgTheme" class="form-input">
          <option value="texture-light" ${s.bg_theme==='texture-light'?'selected':''}>Light Dots</option>
          <option value="texture-ocean" ${s.bg_theme==='texture-ocean'?'selected':''}>Ocean Blue</option>
          <option value="texture-forest" ${s.bg_theme==='texture-forest'?'selected':''}>Forest Green</option>
          <option value="texture-geometric" ${s.bg_theme==='texture-geometric'?'selected':''}>Geometric</option>
        </select></div>
        <div class="form-group"><label>WhatsApp Link</label><input type="text" id="sWa" class="form-input" value="${s.whatsapp_link || ''}"></div>
        <div class="form-group"><label>About Us</label><textarea id="sAbout" class="form-input" rows="3">${s.about_us || ''}</textarea></div>
        <div class="form-group"><label>Contact Us</label><textarea id="sContact" class="form-input" rows="3">${s.contact_us || ''}</textarea></div>
        <div class="form-group"><label>Privacy Policy</label><textarea id="sPrivacy" class="form-input" rows="3">${s.privacy_policy || ''}</textarea></div>
        <div class="form-group"><label>Terms of Service</label><textarea id="sTerms" class="form-input" rows="3">${s.terms_of_service || ''}</textarea></div>
        <div class="form-group"><label>Footer Text</label><input type="text" id="sFooter" class="form-input" value="${s.footer_text || ''}"></div>
        <button class="btn-admin" onclick="saveSettings()">Save Settings</button></div>`;
    }
    document.getElementById('adminContent').innerHTML = html;
  }

  async function loadAdminGroupsList() {
    let html = '';
    if (allData.groups.length === 0) html = '<p>No groups created.</p>';
    allData.groups.forEach(g => { html += `<div style="padding:0.5rem 0; border-bottom:1px solid #eee;"><strong>${g.title}</strong><br><small>${g.description || ''}</small></div>`; });
    document.getElementById('groupList').innerHTML = html;
  }

  async function createGroup() {
    await fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify({ action: "createGroup", title: document.getElementById('gTitle').value, description: document.getElementById('gDesc').value }) });
    alert('Group Created!'); await fetchData(); showTab('groups', document.querySelector('.admin-sidebar button:nth-child(2)'));
  }

  async function uploadDoc() {
    const fileInput = document.getElementById('uFile');
    if (!fileInput.files.length) return alert('Select a file!');
    const btn = document.getElementById('uploadBtn'); btn.disabled = true; btn.innerText = "Uploading...";
    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.onload = async function() {
      const base64 = reader.result.split(',')[1];
      const payload = { action: "uploadDoc", group_id: document.getElementById('uGroup').value, title: document.getElementById('uTitle').value, subject: document.getElementById('uSubject').value, form: document.getElementById('uForm').value, type: document.getElementById('uType').value, desc: document.getElementById('uDesc').value, region: document.getElementById('uRegion').value, exam_type: document.getElementById('uExamType').value, year: document.getElementById('uYear').value, fileName: file.name, mimeType: file.type, fileData: base64 };
      await fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload) });
      alert('Uploaded Successfully!');
      await fetchData(); btn.disabled = false; btn.innerText = "Upload & Publish"; navigate('home');
    };
    reader.readAsDataURL(file);
  }

  async function saveSettings() {
    const payload = { action: "saveSettings", whatsapp_link: document.getElementById('sWa').value, about_us: document.getElementById('sAbout').value, contact_us: document.getElementById('sContact').value, privacy_policy: document.getElementById('sPrivacy').value, terms_of_service: document.getElementById('sTerms').value, footer_text: document.getElementById('sFooter').value, bg_theme: document.getElementById('sBgTheme').value };
    await fetch(SCRIPT_URL, { method: "POST", headers: {"Content-Type":"text/plain"}, body: JSON.stringify(payload) });
    alert('Settings Saved!'); await fetchData(); navigate('home');
  }

  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    let icon = document.getElementById('themeIcon');
    if (document.body.classList.contains('dark-mode')) { icon.classList.remove('fa-moon'); icon.classList.add('fa-sun'); } 
    else { icon.classList.remove('fa-sun'); icon.classList.add('fa-moon'); applyTheme(); }
  }

  window.onload = async function() { await fetchData(); navigate('home'); };
</script>
</body>
</html>
